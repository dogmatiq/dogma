# DO NOT EDIT!
#
# This file is generated by Terraform.
# See https://github.com/dogmatiq/repos.

version: 2
# APM is a beta ecosystem in Dependabot, which fails to update it without this
# setting.
enable-beta-ecosystems: true
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Our own packages are exempt from the default 3-day cooldown, since there is
    # nothing to wait out for a release we made ourselves.
    cooldown:
      default-days: 3
      exclude:
        - "github.com/dogmatiq/*"
  - package-ecosystem: apm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Our own packages are exempt from the default 3-day cooldown, since there is
    # nothing to wait out for a release we made ourselves.
    cooldown:
      default-days: 3
      exclude:
        - "dogmatiq/*"
